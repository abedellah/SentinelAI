<!-- templates/login.html -->
{% extends "base.html" %}

{% block title %}Connexion - SentinelAI{% endblock %}

{% block content %}
<div class="login-container">
    <div class="row justify-content-center w-100">
        <div class="col-md-5">
            <div class="card login-card">
                <div class="card-body p-5">
                    <div class="text-center mb-5">
                        <div class="mb-4">
                            <i class="bi bi-shield-lock-fill" style="font-size: 4rem; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"></i>
                        </div>
                        <h2 class="fw-bold mb-2" style="color: var(--dark);">Bienvenue sur SentinelAI</h2>
                        <p class="text-muted">Système de détection d'intrusions intelligent</p>
                    </div>
                    
                    <form method="POST">
                        <div class="mb-4">
                            <label for="username" class="form-label">
                                <i class="bi bi-person me-2"></i>Nom d'utilisateur
                            </label>
                            <input type="text" class="form-control form-control-lg" id="username" name="username" required placeholder="Entrez votre nom d'utilisateur">
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">
                                <i class="bi bi-lock me-2"></i>Mot de passe
                            </label>
                            <input type="password" class="form-control form-control-lg" id="password" name="password" required placeholder="Entrez votre mot de passe">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-3 mb-3">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
                        </button>
                    </form>
                    
                    <div class="mt-4 p-3 rounded" style="background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.1)); border: 1px solid rgba(99, 102, 241, 0.2);">
                        <div class="text-center">
                            <small class="text-muted d-block mb-2"><i class="bi bi-info-circle me-1"></i>Compte de démonstration</small>
                            <div class="d-flex justify-content-center gap-3">
                                <span class="badge bg-primary"><i class="bi bi-person-badge me-1"></i>admin / admin123</span>
                                <span class="badge bg-secondary"><i class="bi bi-person me-1"></i>abdellah / abdellah</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="text-center mt-4">
                <p class="text-white-50 small">
                    <i class="bi bi-shield-check me-2"></i>
                    Système sécurisé avec chiffrement bcrypt
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
